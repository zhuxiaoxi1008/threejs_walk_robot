<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Three.js - 机器人动作大全 (终极完美版)</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #d4f8c6; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;}
        canvas { display: block; }
        
        /* 左上角监控面板 */
        #debug { 
            position: absolute; top: 15px; left: 15px; color: #00ff00; font-family: monospace; 
            z-index: 100; background: rgba(0,0,0,0.7); padding: 10px 15px; 
            border-radius: 8px; border: 1px solid rgba(0, 255, 0, 0.3); pointer-events: none;
        }
        
        /* 右下角紧凑操作提示面板 */
        #controls-ui {
            position: absolute; bottom: 20px; right: 20px;
            background: rgba(20, 25, 30, 0.85); padding: 12px; border-radius: 10px;
            color: #fff; z-index: 100; display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px;
            backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            pointer-events: none; 
        }
        .key-item {
            display: flex; align-items: center; gap: 8px; font-size: 12px;
        }
        .key-item.full-width { grid-column: span 2; justify-content: center; margin-bottom: 4px;}
        .key { 
            background: #333; border: 1px solid #555; border-bottom: 3px solid #111; 
            padding: 2px 8px; border-radius: 4px; font-family: monospace; font-weight: bold; font-size: 12px;
            color: #00f0ff; min-width: 20px; text-align: center;
        }
        .desc { color: #ccc; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.min.js"></script>
</head>
<body>
    <div id="debug">正在初始化...</div>
    
    <!-- 右下角紧凑按键 UI -->
    <div id="controls-ui">
        <div class="key-item full-width"><span class="desc" style="color:#0f0;">👇 移动 (W/A/S/D)</span></div>
        
        <div class="key-item"><span class="key">W</span><span class="desc">前进</span></div>
        <div class="key-item"><span class="key">S</span><span class="desc">后退</span></div>
        <div class="key-item"><span class="key">A</span><span class="desc">左转</span></div>
        <div class="key-item"><span class="key">D</span><span class="desc">右转</span></div>
        <div class="key-item full-width"><span class="key">Shift</span> + <span class="key">W</span> <span class="desc">奔跑 (Running)</span></div>
        
        <div class="key-item full-width" style="margin-top: 6px; border-top: 1px solid #444; padding-top: 8px;">
            <span class="desc" style="color:#f0f;">👇 特技动作</span>
        </div>
        
        <div class="key-item"><span class="key">空格</span><span class="desc">跳跃</span></div>
        <div class="key-item"><span class="key">Q</span><span class="desc">跑跳</span></div>
        <div class="key-item"><span class="key">1</span><span class="desc">跳舞</span></div>
        <div class="key-item"><span class="key">2</span><span class="desc">挥手</span></div>
        <div class="key-item"><span class="key">3</span><span class="desc">出拳</span></div>
        <div class="key-item"><span class="key">4</span><span class="desc">点赞</span></div>
        <div class="key-item"><span class="key">5</span><span class="desc">是(Yes)</span></div>
        <div class="key-item"><span class="key">6</span><span class="desc">否(No)</span></div>
        <div class="key-item"><span class="key">7</span><span class="desc">坐下</span></div>
        <div class="key-item"><span class="key">8</span><span class="desc">倒地</span></div>
    </div>
    
    <script>
        var scene = new THREE.Scene();
        scene.background = new THREE.Color(0xd4f8c6); 
        scene.fog = new THREE.Fog(0xd4f8c6, 20, 60);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(8, 5, 8); 

        var renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        var controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.target.set(0, 1, 0);

        // 灯光
        var ambientLight = new THREE.AmbientLight(0xffffff, 0.8); 
        scene.add(ambientLight);
        var dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
        dirLight.position.set(10, 20, 10);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // 网格地面 (高度设定为 0)
        const gridHelper = new THREE.GridHelper(200, 200, 0x333333, 0xaaaaaa);
        gridHelper.position.y = 0; 
        scene.add(gridHelper);

        // ==========================================
        // ⌨️ 键盘监听
        // ==========================================
        const keys = { w: false, a: false, s: false, d: false, shift: false };
        
        window.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            if (['w', 'a', 's', 'd'].includes(key)) keys[key] = true;
            if (key === 'shift') keys.shift = true;
            
            // 特殊动作触发
            if (e.code === 'Space') triggerSpecialAction('Jump');
            if (key === 'q') triggerSpecialAction('WalkJump');
            if (key === '1') triggerSpecialAction('Dance');
            if (key === '2') triggerSpecialAction('Wave');
            if (key === '3') triggerSpecialAction('Punch');
            if (key === '4') triggerSpecialAction('ThumbsUp');
            if (key === '5') triggerSpecialAction('Yes');
            if (key === '6') triggerSpecialAction('No');
            if (key === '7') triggerSpecialAction('Sitting');
            if (key === '8') triggerSpecialAction('Death');
        });
        
        window.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            if (['w', 'a', 's', 'd'].includes(key)) keys[key] = false;
            if (key === 'shift') keys.shift = false;
        });

        // ==========================================
        // 🎬 动画系统
        // ==========================================
        var loader = new THREE.GLTFLoader();
        
        let robotModel = null;
        let mixer = null;        
        const actions = {};       
        let activeAction = null;  
        
        let currentSpeed = 0;       
        const walkSpeed = 1.5;      
        const runSpeed = 4.5;       
        const rotateSpeed = 2.5;    
        let isMoving = false;      

        function fadeToAction(name, duration = 0.2, loopOnce = false) {
            if (!actions[name]) return;
            const nextAction = actions[name];
            if (nextAction === activeAction) return; 
            
            const prevAction = activeAction;
            activeAction = nextAction;
            
            if (prevAction) prevAction.fadeOut(duration);
            
            activeAction.reset();
            
            if (loopOnce) {
                activeAction.setLoop(THREE.LoopOnce);
                activeAction.clampWhenFinished = true; 
            } else {
                activeAction.setLoop(THREE.LoopRepeat);
            }
            
            activeAction.fadeIn(duration).play();
        }

        function triggerSpecialAction(name) {
            if (!actions[name]) return;
            fadeToAction(name, 0.2, true);
        }

        loader.load("robot.glb", function (gltf) {
            const model = gltf.scene;
            robotModel = model;
            scene.add(model);

            // 模型初始朝向
            model.rotation.y = 0; 

            // ==========================================
            // 📐 核心修复：自动计算包围盒，让模型完美贴地 (y=0)
            // ==========================================
            const groundY = 0; // 网格地面的高度
            const box = new THREE.Box3().setFromObject(model);
            const modelBottomY = box.min.y;
            const offsetY = groundY - modelBottomY;
            
            // 将模型整体抬高/降低，使脚底刚好踩在 y=0 的地面上
            model.position.y += offsetY; 
            
            // 水平位置归零
            model.position.x = 0;
            model.position.z = 0;

            // ==========================================
            // 初始化动画混合器
            // ==========================================
            mixer = new THREE.AnimationMixer(model);

            // 把所有动画存入字典
            gltf.animations.forEach((clip) => {
                actions[clip.name] = mixer.clipAction(clip);
            });

            // 默认站立
            if (actions['Idle']) {
                activeAction = actions['Idle'];
                activeAction.play();
            }

            // 动作播完自动回到站立
            mixer.addEventListener('finished', () => {
                if (keys.w || keys.s) {
                    fadeToAction(keys.shift ? 'Running' : 'Walking', 0.2);
                } else {
                    fadeToAction('Idle', 0.3);
                }
            });
        });

        // ==========================================
        // 动画循环
        // ==========================================
        const clock = new THREE.Clock();
        const debugPanel = document.getElementById('debug');

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            
            if (robotModel && mixer) {
                
                // 1. 转向
                if (keys.a) robotModel.rotation.y += rotateSpeed * delta;
                if (keys.d) robotModel.rotation.y -= rotateSpeed * delta;

                // 2. 移动与速度计算（结合 Shift 奔跑）
                let targetSpeed = 0;
                if (keys.w) targetSpeed = keys.shift ? runSpeed : walkSpeed;
                if (keys.s) targetSpeed = -walkSpeed; // 后退通常比前进慢
                
                currentSpeed = THREE.MathUtils.lerp(currentSpeed, targetSpeed, 10 * delta);

                const moveX = Math.sin(robotModel.rotation.y) * currentSpeed * delta;
                const moveZ = Math.cos(robotModel.rotation.y) * currentSpeed * delta;
                robotModel.position.x += moveX;
                robotModel.position.z += moveZ;

                // 3. 移动状态与动画切换
                isMoving = Math.abs(currentSpeed) > 0.1;
                
                if (isMoving) {
                    // 判断是走还是跑
                    const targetAnim = (keys.shift && currentSpeed > 0) ? 'Running' : 'Walking';
                    
                    // 防止打断跳跃等一次性动作
                    if (activeAction !== actions[targetAnim] && activeAction !== actions['Jump'] && activeAction !== actions['WalkJump']) {
                        fadeToAction(targetAnim, 0.2);
                    }
                    
                    // 匹配动画速度
                    if (actions[targetAnim]) {
                        actions[targetAnim].timeScale = Math.abs(currentSpeed) / (targetAnim === 'Running' ? runSpeed : walkSpeed);
                    }
                } else {
                    // 停下时，如果当前在走路/跑步，就切回站立
                    if (activeAction === actions['Walking'] || activeAction === actions['Running']) {
                        fadeToAction('Idle', 0.2);
                    }
                }

                // 4. 更新混合器
                mixer.update(delta);

                // 5. UI 监控
                let currentAnimName = "None";
                for (let name in actions) {
                    if (actions[name] === activeAction) currentAnimName = name;
                }
                
                debugPanel.innerHTML = `
                    <b>【状态监控】</b><br>
                    动作: <span style="color:#00f0ff;">${currentAnimName}</span><br>
                    速度: ${Math.abs(currentSpeed).toFixed(1)} m/s<br>
                `;

                // 镜头平滑跟随
                controls.target.lerp(robotModel.position.clone().add(new THREE.Vector3(0, 1, 0)), 5 * delta);
            }

            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener("resize", function () {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
