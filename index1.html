<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robot 3D Viewer - 学习版带注释</title>

    <!-- 1. 引入 Three.js 核心库 (r128 是一个经典稳定版本) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- 2. 引入轨道控制器 (控制鼠标左键旋转、右键平移、滚轮缩放) -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.min.js"></script>
    <!-- 3. 引入 GLTFLoader (专门用来解析 .glb / .gltf 格式模型) -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.min.js"></script>

    <style>
        /* CSS 样式部分：确保页面全屏，并且背景透明 */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            overflow: hidden; /* 隐藏滚动条 */
            background: transparent; /* 背景透明，配合 WebGL 的 alpha:true */
            height: 100vh;
            width: 100vw;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        /* 3D 画布容器，铺满全屏 */
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        
        /* 加载提示层的样式 */
        #loading {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10; /* 确保在画布上方 */
            transition: opacity 0.5s; /* 淡出动画 */
            color: white;
        }
        
        /* 旋转的加载圈 */
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid #4fc3f7; /* 顶部蓝边 */
            border-radius: 50%;
            animation: spin 1s linear infinite; /* 旋转动画 */
            margin-bottom: 15px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- 加载动画的 DOM 层 -->
    <div id="loading">
        <div class="spinner"></div>
        <p>Loading robot model...</p>
    </div>
    
    <!-- 用于放置 WebGL (Canvas) 画布的容器 -->
    <div id="canvas-container"></div>

    <script>
        // ==========================================
        // 第一部分：三大件初始化 (场景、相机、渲染器)
        // ==========================================

        // 1. 创建场景 (Scene) —— 相当于一个“宇宙”，所有的物体都要放进去
        const scene = new THREE.Scene();
        scene.background = null; // 设置背景为 null，为了配合 HTML 页面背景透出
        
        // 2. 创建透视相机 (PerspectiveCamera) —— 相当于“眼睛”
        // 参数：视野角度(45度), 宽高比(当前窗口), 近裁剪面(0.1), 远裁剪面(1000)
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        // 把相机放在 (x=0, y=1.3, z=5) 的位置，稍微从上往下看
        camera.position.set(0, 1.3, 5); 
        
        // 3. 创建渲染器 (WebGLRenderer) —— 相当于“画笔”，负责把宇宙画到屏幕上
        const renderer = new THREE.WebGLRenderer({ 
            antialias: true, // 开启抗锯齿，让模型边缘更平滑
            alpha: true      // 开启透明背景
        });
        renderer.setSize(window.innerWidth, window.innerHeight); // 设置画布大小等于窗口大小
        renderer.setPixelRatio(window.devicePixelRatio); // 适配高清屏(Retina/4K)，防止模糊
        renderer.shadowMap.enabled = true; // 开启阴影计算
        
        // 把渲染器生成的 <canvas> 标签塞进 HTML 的 div 里
        document.getElementById('canvas-container').appendChild(renderer.domElement);
        
        // ==========================================
        // 第二部分：控制器与交互 (OrbitControls)
        // ==========================================
        
        // 创建轨道控制器，绑定相机和渲染器的 DOM 元素
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; // 开启阻尼（惯性效果），滑动鼠标时会有丝滑的减速感
        controls.dampingFactor = 0.05; // 阻尼系数，越小越滑
        controls.screenSpacePanning = false; // 禁用屏幕平移
        
        // 限制相机的垂直旋转角度 (极角)，防止镜头钻到地板下面
        controls.minPolarAngle = Math.PI / 6;       // 最低只能看到 30度
        controls.maxPolarAngle = 1.6 * Math.PI / 3; // 最高只能看到 120度
        
        // 限制相机的缩放距离
        controls.minDistance = 5; // 最近只能拉到 5 的距离
        controls.maxDistance = 8; // 最远只能推到 8 的距离
        
        // 自动旋转功能配置
        controls.autoRotate = true; 
        controls.autoRotateSpeed = 0.5; // 旋转速度
        
        // ==========================================
        // 第三部分：灯光系统 (Lights)
        // ==========================================
        
        // 1. 环境光 (AmbientLight) —— 提供全局的基础照明，没有方向，不产生阴影
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);
        
        // 2. 主平行光 (DirectionalLight) —— 模拟太阳光，产生清晰的阴影
        const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
        directionalLight.position.set(5, 10, 7); // 从右上方照下来
        directionalLight.castShadow = true; // 允许产生阴影
        scene.add(directionalLight);
        
        // 3. 背光/补光 (DirectionalLight) —— 从背面照，消除死黑区域，增加立体感
        const backLight = new THREE.DirectionalLight(0xffffff, 0.5);
        backLight.position.set(-5, 5, -5);
        scene.add(backLight);
        
        // ==========================================
        // 第四部分：交互逻辑 (鼠标控制自动旋转)
        // ==========================================
        
        let autoRotateTimer;
        
        // 开启自动旋转的延时函数 (鼠标移开后 3 秒重新开始旋转)
        function enableAutoRotate() {
            autoRotateTimer = setTimeout(() => {
                controls.autoRotate = true; 
            }, 3000);
        }
        
        // 当鼠标按下（且是左键）时，停止自动旋转，方便用户查看
        renderer.domElement.addEventListener('mousedown', (event) => {
            if (event.button === 0) { 
                controls.autoRotate = false; 
                clearTimeout(autoRotateTimer); 
            }
        });
        
        // 当鼠标抬起或离开画布时，触发准备恢复自动旋转的函数
        renderer.domElement.addEventListener('mouseup', () => { enableAutoRotate(); });
        renderer.domElement.addEventListener('mouseleave', () => { enableAutoRotate(); });
        
        // ==========================================
        // 第五部分：加载模型 (GLTFLoader)
        // ==========================================
        
        const loader = new THREE.GLTFLoader();
        // 注意：这里需要确保你的同级目录下有 robot.glb 文件
        const modelUrl = 'robot.glb'; 
        const loadingScreen = document.getElementById('loading'); // 获取加载动画 DOM
        
        // 异步加载模型
        loader.load(
            modelUrl,
            // 1. 加载成功回调
            function (gltf) {
                const robotModel = gltf.scene; // gltf.scene 就是解析好的 3D 模型根节点
                scene.add(robotModel); // 把模型扔进场景里
                
                // 调整模型的大小和位置
                robotModel.scale.set(0.6, 0.6, 0.6); // 缩小到 60%
                robotModel.position.y = -1; // 往下沉一点，防止悬浮在空中
                
                // 遍历模型的所有子节点，开启阴影投射和接收
                robotModel.traverse(function (node) {
                    if (node.isMesh) { // 如果是一个网格（有实体几何形状的）
                        node.castShadow = true;    // 允许投射阴影
                        node.receiveShadow = true; // 允许接收阴影
                    }
                });
                
                // 延迟 1 秒后，隐藏加载层（提升用户体验）
                setTimeout(() => {
                    loadingScreen.style.opacity = '0'; // 触发 CSS 淡出
                    setTimeout(() => { 
                        loadingScreen.style.display = 'none'; 
                    }, 500); // 500ms 后彻底隐藏 DOM
                    enableAutoRotate(); // 模型加载完，开启自动旋转
                }, 1000);
            },
            // 2. 加载进度回调 (这里写的是 undefined，表示不处理进度条)
            undefined,
            // 3. 加载失败回调
            function (error) {
                console.error('Error loading model:', error);
                loadingScreen.innerHTML = `<p style="color: #ff6b6b;">Error loading model.</p>`;
            }
        );
        
        // ==========================================
        // 第六部分：窗口适配与动画循环
        // ==========================================
        
        // 窗口大小改变时，重新计算相机的宽高比和渲染器大小，防止画面拉伸变形
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix(); // 通知相机更新投影矩阵
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        window.addEventListener('resize', onWindowResize);
        
        // 时钟对象，用于计算帧间隔时间（delta），保证不同刷新率下的动画速度一致
        const clock = new THREE.Clock();
        
        // 核心循环：每一帧都执行（通常 60帧/秒）
        function animate() {
            // 请求浏览器在下一帧继续调用 animate，形成死循环
            requestAnimationFrame(animate); 
            
            // 获取距离上一帧过去的时间（秒），后面做复杂动画会用到
            const delta = clock.getDelta(); 
            
            controls.update(); // 更新控制器（配合 enableDamping 惯性效果必须调用）
            renderer.render(scene, camera); // 正式渲染画面：把场景渲染到屏幕上
        }
        
        animate(); // 启动动画循环
    </script>
</body>
</html>
